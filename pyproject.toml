[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "google-workspace-suite-mcp"
version = "0.7.0"
description = "Aligned MCP servers for Gmail, Calendar, Sheets, Docs, and Drive with persistent, multi-account auth"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nitai Aharoni" }]
keywords = ["mcp", "google", "gmail", "calendar", "sheets", "docs", "drive", "workspace", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    # mcp 2.x API (MCPServer, snake_case types, CallToolResult); not 1.x compatible.
    "mcp>=2,<3",
    "anyio>=4",
    "google-auth-core>=0.3.0",
    "gmail-cli-oauth>=1.6.0",
    "google-calendar-cli>=1.7.0",
    "google-api-python-client>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/nitaiaharoni1/google-workspace-mcp"
Repository = "https://github.com/nitaiaharoni1/google-workspace-mcp"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-anyio>=0.0.0", "anyio>=4", "ruff>=0.4"]

[project.scripts]
gmail-mcp = "google_workspace_mcp.gmail.server:main"
gcal-mcp = "google_workspace_mcp.calendar.server:main"
gcal-busy-sync = "google_workspace_mcp.calendar.busy_sync:main"
gsheets-mcp = "google_workspace_mcp.sheets.server:main"
gdocs-mcp = "google_workspace_mcp.docs.server:main"
gdrive-mcp = "google_workspace_mcp.drive.server:main"
gworkspace-mcp = "google_workspace_mcp.workspace.server:main"
# Out-of-band auth CLI (from google-auth-core); shipped here so a single
# `pipx install google-workspace-suite-mcp` also provides `google-auth login`.
google-auth = "google_auth_core.cli:main"

[tool.setuptools.packages.find]
include = ["google_workspace_mcp*"]

[tool.pytest.ini_options]
anyio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
