name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - name: ruff
        run: |
          ruff check . > ruff.txt 2>&1 || { echo "::error title=ruff::$(tail -40 ruff.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
      - name: pytest
        if: always()
        run: |
          pytest -q -rfE --tb=short > pytest.txt 2>&1 || { echo "::error title=pytest::$(tail -80 pytest.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"; exit 1; }
